name: replit_mobile
description: "RepLiT - Report Location and Incident in Time"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend & Auth
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Camera & Image
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # HTTP
  http: ^1.2.2
  dio: ^5.7.0

  # Biometric Auth
  local_auth: ^2.3.0

  # Dialling emergency hotlines (tel: intents)
  url_launcher: ^6.3.1

  # UI Utilities
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  http_parser: ^4.1.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/design/
